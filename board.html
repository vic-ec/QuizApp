<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard</title>
<style>
  body{margin:0;background:#0f1419;color:#e8edf2;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:5vh 6vw}
  h1{font-size:5vw;margin:0 0 1vh}
  .sub{color:#8d9aa8;font-size:2.2vw;margin-bottom:4vh}
  .bar{display:flex;align-items:center;gap:2vw;margin:2.2vh 0}
  .n{width:28vw;font-size:3.2vw;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t{flex:1;background:#1a2129;border-radius:1.5vw;height:7vh;overflow:hidden}
  .f{height:100%;background:#4f8cff;border-radius:1.5vw;transition:width .6s;min-width:.5vw}
  .bar:first-child .f{background:#f1c40f}
  .s small{font-size:1.6vw;color:#8d9aa8;font-weight:500}
  .s{width:14vw;text-align:right;font-size:3.6vw;font-weight:800}
</style>
</head>
<body>
<h1 id="title">Leaderboard</h1>
<div class="sub" id="sub"></div>
<div id="list"></div>
<script src="vendor-supabase.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(QUIZ_CONFIG.url, QUIZ_CONFIG.key);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function load(){
  const {data:st} = await sb.from('quiz_state').select('*').eq('id',1).single();
  if(!st) return;
  const [g,a] = await Promise.all([
    sb.from('players').select('name').eq('session_id',st.session_id),
    sb.from('answers').select('player,is_correct,points').eq('session_id',st.session_id)
  ]);
  const groups=(g.data||[]).map(r=>r.name), answers=a.data||[];
  const revealedN=(st.current_question-1)+(st.revealed?1:0);
  const scores=groups.map(n=>{const m=answers.filter(x=>x.player===n);return {n,s:m.reduce((t,x)=>t+(x.points||0),0),c:m.filter(x=>x.is_correct===true).length}}).sort((x,y)=>y.s-x.s||y.c-x.c||x.n.localeCompare(y.n));
  const maxP=Math.max(1,...scores.map(x=>x.s));
  document.getElementById('title').textContent=st.quiz_title+' · '+st.session_name+(st.ended?' — Final':' — Leaderboard');
  document.getElementById('sub').textContent=revealedN+' of '+st.total_questions+' questions revealed';
  document.getElementById('list').innerHTML=scores.map(x=>`<div class="bar"><div class="n">${esc(x.n)}</div><div class="t"><div class="f" style="width:${(x.s/maxP*100).toFixed(0)}%"></div></div><div class="s">${x.s}<small> · ${x.c}✓</small></div></div>`).join('');
}
sb.channel('board')
  .on('postgres_changes',{event:'*',schema:'public',table:'quiz_state'},load)
  .on('postgres_changes',{event:'*',schema:'public',table:'answers'},load)
  .on('postgres_changes',{event:'*',schema:'public',table:'players'},load)
  .subscribe();
setInterval(load,3000); load();
</script>
</body>
</html>
