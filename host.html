<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz — Host</title>
<style>
  :root{--bg:#0f1419;--card:#1a2129;--line:#2b3642;--text:#e8edf2;--muted:#8d9aa8;
        --accent:#4f8cff;--ok:#2ecc71;--bad:#e74c3c;--warn:#f1c40f;
        --A:#e74c3c;--B:#3498db;--C:#f1c40f;--D:#2ecc71;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .layout{display:grid;grid-template-columns:1fr 340px;gap:16px;padding:16px;min-height:100vh}
  @media(max-width:900px){.layout{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  h1{margin:0;font-size:22px}
  h2{margin:0 0 10px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .big{font-size:48px;font-weight:800;line-height:1}
  .timer{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1}
  .timer.low{color:var(--bad)} .timer.up{color:var(--warn);font-size:22px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:#2b3642;color:var(--text)}
  button.primary{background:var(--accent);color:#fff}
  button.ok{background:var(--ok);color:#06220f}
  button.warn{background:var(--warn);color:#2a2400}
  button.danger{background:var(--bad);color:#fff}
  button.xl{font-size:22px;padding:18px 26px}
  button:disabled{opacity:.35;cursor:default}
  input,select{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0f1419;color:var(--text)}
  .players{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .g{border:2px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-weight:600;position:relative}
  .g.done{border-color:var(--accent);background:#1d2f4d}
  .g.right{border-color:var(--ok);background:#163d2b}
  .g.wrong{border-color:var(--bad);background:#4a1f1b}
  .g .c{font-size:26px;display:block;margin-top:4px}
  .g .t{font-size:12px;color:var(--muted);font-weight:500}
  .g .x{position:absolute;top:4px;right:8px;color:var(--muted);cursor:pointer;font-weight:400;font-size:12px}
  .bar{display:flex;align-items:center;gap:10px;margin:8px 0}
  .bar .n{width:140px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .t{flex:1;background:#0f1419;border-radius:8px;height:30px;overflow:hidden}
  .bar .f{height:100%;background:var(--accent);border-radius:8px;transition:width .4s;min-width:2px}
  .bar .s{width:110px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .bar .s small{color:var(--muted);font-weight:500}
  .dist{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .d{border-radius:10px;padding:12px;text-align:center;border:3px solid transparent;color:#fff;font-weight:700}
  .d.A{background:var(--A)} .d.B{background:var(--B)} .d.C{background:var(--C);color:#2a2400} .d.D{background:var(--D);color:#06220f}
  .d.correct{border-color:#fff} .d.dim{opacity:.3}
  .d b{font-size:26px;display:block}
  .key{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
  .key .k{display:flex;align-items:center;gap:4px;font-size:13px}
  .key .k span{width:24px;color:var(--muted)}
  .key .k button{padding:6px 0;width:30px;font-size:13px;background:#0f1419;border:1px solid var(--line)}
  .key .k button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .muted{color:var(--muted);font-size:13px}
  .pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;margin-right:4px}
  .pill.waiting{background:#2b3642;color:var(--muted)} .pill.open{background:#1d2f4d;color:#9cc0ff}
  .pill.locked{background:#3a3415;color:var(--warn)} .pill.revealed{background:#163d2b;color:var(--ok)}
  .pill.ended{background:#4a1f1b;color:#ff8a7f} .pill.timeup{background:#3a3415;color:var(--warn)}
  .pill.nokey{background:#4a1f1b;color:#ff8a7f}
  #qr{background:#fff;padding:8px;border-radius:8px;width:fit-content}
  .net{position:fixed;left:0;right:0;bottom:0;background:#4a1f1b;color:#ff8a7f;text-align:center;padding:8px;display:none}
  a{color:#9cc0ff}
  label.muted{min-width:110px}
</style>
</head>
<body>
<div id="gate" class="card" style="max-width:360px;margin:60px auto">
  <h1>Host login</h1>
  <p class="muted">Enter the host PIN.</p>
  <input id="pin" type="password" placeholder="PIN" style="width:100%;font-size:20px">
  <button class="primary" id="login" style="width:100%;margin-top:10px">Enter</button>
  <p id="pinerr" style="color:#ff8a7f"></p>
</div>
<div id="app" class="layout" style="display:none"></div>
<div class="net" id="net">Connection lost — retrying…</div>

<script src="vendor-supabase.js"></script>
<script src="vendor-qrcode.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(QUIZ_CONFIG.url, QUIZ_CONFIG.key);
const app = document.getElementById('app'), net = document.getElementById('net');
let pin = sessionStorage.getItem('quiz_pin') || '';
let st=null, players=[], answers=[], key={}, correct=null, keyOpen=false, clockOffset=0;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const serverNow = () => Date.now() - clockOffset;
async function syncClock(){ try{ const t0=Date.now(); const {data}=await sb.rpc('server_now'); const t1=Date.now(); if(data) clockOffset=(t0+t1)/2-new Date(data).getTime(); }catch(e){} }
async function act(action, value={}){
  const {data,error} = await sb.rpc('host_action',{p_pin:pin,p_action:action,p_value:value});
  if(error){ alert(error.message); throw error; }
  return data;
}

async function login(){
  const p = document.getElementById('pin').value.trim();
  const {error} = await sb.rpc('host_action',{p_pin:p,p_action:'ping'});
  if(error){ document.getElementById('pinerr').textContent = error.message; return; }
  pin = p; sessionStorage.setItem('quiz_pin', p); start();
}
document.getElementById('login').onclick = login;
document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==='Enter') login();});

async function start(){
  document.getElementById('gate').style.display='none';
  app.style.display='grid';
  await syncClock();
  key = await act('get_key');
  sb.channel('host')
    .on('postgres_changes',{event:'*',schema:'public',table:'quiz_state'},load)
    .on('postgres_changes',{event:'*',schema:'public',table:'answers'},load)
    .on('postgres_changes',{event:'*',schema:'public',table:'players'},load)
    .subscribe();
  setInterval(load, 3000); setInterval(tick, 250); setInterval(syncClock, 60000);
  load();
}

async function load(){
  try{
    const {data:s,error} = await sb.from('quiz_state').select('*').eq('id',1).single();
    if(error) throw error;
    st = s;
    const [g,a] = await Promise.all([
      sb.from('players').select('name').eq('session_id',s.session_id).order('joined_at'),
      sb.from('answers').select('player,question,choice,is_correct,points,elapsed_ms').eq('session_id',s.session_id)
    ]);
    players = (g.data||[]).map(r=>r.name); answers = a.data||[];
    correct = s.revealed ? (await sb.rpc('revealed_answer',{p_question:s.current_question})).data : null;
    net.style.display='none';
  }catch(e){ net.style.display='block'; }
  render();
}

function remaining(){
  if(!st || !st.timer_seconds || !st.question_opened_at) return null;
  return Math.max(0, st.timer_seconds - (serverNow() - new Date(st.question_opened_at).getTime())/1000);
}
let wasExpired=false;
function tick(){
  const el=document.getElementById('timer'); if(!el||!st) return;
  const r=remaining();
  if(r===null || st.revealed || st.locked || st.ended){ el.textContent=''; return; }
  el.textContent = r>0 ? Math.ceil(r) : "TIME UP";
  el.className = 'timer' + (r<=0?' up':r<=5?' low':'');
  if((r<=0)!==wasExpired){ wasExpired=(r<=0); render(true); }
}

let lastSig = '';
function render(force){
  if(!st) return;
  const sig = JSON.stringify([st,players,answers,correct,key,keyOpen]);
  if(!force && sig===lastSig) return;
  lastSig = sig;
  const keep = {}; ['sname','newpin','total','goto','timer_in','qtitle'].forEach(id=>{const el=document.getElementById(id); if(el && document.activeElement===el) keep[id]=el.value;});
  const q = st.current_question;
  const cur = {}; answers.filter(a=>a.question===q).forEach(a=>cur[a.player]=a);
  const done = players.filter(g=>cur[g]).length;
  const r = remaining(), timeUp = r!==null && r<=0;
  const status = st.ended?'ended':st.revealed?'revealed':st.locked?(st.question_opened_at?'locked':'waiting'):timeUp?'timeup':'open';
  const statusLabel = {ended:'SESSION ENDED',revealed:'REVEALED',locked:'LOCKED',waiting:'WAITING TO OPEN',timeup:"TIME UP",open:'OPEN'}[status];
  const keyCur = key[q];
  const revealedN = (q-1)+(st.revealed?1:0);
  const scores = players.map(g=>{ const mine=answers.filter(a=>a.player===g); return {g, p:mine.reduce((t,a)=>t+(a.points||0),0), c:mine.filter(a=>a.is_correct===true).length}; })
                       .sort((x,y)=>y.p-x.p||y.c-x.c||x.g.localeCompare(y.g));
  const maxP = Math.max(1,...scores.map(s=>s.p));
  const dist = {A:0,B:0,C:0,D:0}; Object.values(cur).forEach(a=>dist[a.choice]++);
  const candidateUrl = location.origin + location.pathname.replace(/host(\.html)?$/,'');
  const canOpen = !st.ended && (!st.question_opened_at || st.locked || timeUp) && !st.revealed;

  app.innerHTML = `
  <div>
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <div>
          <h1>${esc(st.quiz_title)} <span style="color:var(--muted);font-weight:500">· ${esc(st.session_name)}</span></h1>
          <div style="margin-top:6px"><span class="pill ${status}">${statusLabel}</span>
          ${keyCur?'':'<span class="pill nokey">No answer key for Q'+q+'</span>'}
          <span class="pill waiting">${st.scoring==='flat'?'Flat scoring':'Speed scoring'} · ${st.timer_seconds?st.timer_seconds+' s':'no timer'}</span></div>
        </div>
        <div style="display:flex;gap:24px;align-items:flex-end">
          <div class="timer" id="timer"></div>
          <div style="text-align:right">
            <div class="big">Q${q}<span style="font-size:20px;color:var(--muted)"> / ${st.total_questions}</span></div>
            <div class="muted">${done} of ${players.length} answered</div>
          </div>
        </div>
      </div>
      <div class="row" style="margin-top:14px">
        <button id="prev" ${q<=1||st.ended?'disabled':''}>◀ Prev</button>
        <button class="primary xl" id="open" ${canOpen?'':'disabled'}>${st.question_opened_at&&!st.revealed?'↻ Restart timer':'▶ Open question'}</button>
        <button class="warn xl" id="lock" ${status==='open'?'':'disabled'}>🔒 Lock</button>
        <button class="ok xl" id="reveal" ${st.revealed||!keyCur||!st.question_opened_at||st.ended?'disabled':''}>✓ Reveal</button>
        <button class="primary xl" id="next" ${q>=st.total_questions||st.ended?'disabled':''}>Next ▶</button>
        <span style="flex:1"></span>
        <button class="danger" id="endsess" ${st.ended?'disabled':''}>End session</button>
      </div>
      <p class="muted" style="margin:10px 0 0">Flow: show the image in Canva → <b>Open question</b> (timer starts) → candidates submit → <b>Reveal</b> (after time is up or everyone has answered) → advance Canva → <b>Next</b> opens the next question immediately. <b>End session</b> shows candidates their final score and rank.</p>
    </div>

    <div class="card">
      <h2>Candidates — question ${q}</h2>
      ${players.length?'':'<p class="muted">Nobody has joined this session yet. Show them the QR code →</p>'}
      <div class="players">
        ${players.map(g=>{
          const a=cur[g]; let cls='g';
          if(a){ cls += st.revealed ? (a.is_correct?' right':' wrong') : ' done'; }
          const main = a ? (st.revealed||st.locked ? a.choice : '✓') : '…';
          const sub = a ? (st.revealed ? `+${a.points} pts · ${(a.elapsed_ms/1000).toFixed(1)} s` : `${(a.elapsed_ms/1000).toFixed(1)} s`) : '';
          return `<div class="${cls}"><span class="x" data-g="${esc(g)}" title="Remove from session">✕</span>${esc(g)}<span class="c">${main}</span><span class="t">${sub}</span></div>`;
        }).join('')}
      </div>
    </div>

    <div class="card">
      <h2>Leaderboard <span class="muted" style="text-transform:none">(${revealedN} of ${st.total_questions} revealed)</span></h2>
      ${scores.map(x=>`<div class="bar"><div class="n">${esc(x.g)}</div><div class="t"><div class="f" style="width:${(x.p/maxP*100).toFixed(0)}%"></div></div><div class="s">${x.p} <small>pts · ${x.c}✓</small></div></div>`).join('')||'<p class="muted">—</p>'}
      <p class="muted"><a href="board.html" target="_blank">Open full-screen leaderboard for the projector ↗</a></p>
    </div>

    <div class="card">
      <h2>Answer spread — question ${q}</h2>
      <div class="dist">${['A','B','C','D'].map(o=>`<div class="d ${o} ${st.revealed?(o===correct?'correct':'dim'):''}"><b>${dist[o]}</b>${o}</div>`).join('')}</div>
    </div>
  </div>

  <div>
    <div class="card">
      <h2>Join link</h2>
      <div id="qr"></div>
      <p style="word-break:break-all;margin:8px 0 0"><a href="${candidateUrl}" target="_blank">${candidateUrl}</a></p>
    </div>
    <div class="card">
      <h2>Quiz</h2>
      <div class="row"><input id="qtitle" placeholder="Quiz title, e.g. ECG Quiz" value="${esc(st.quiz_title)}" style="flex:1"><button id="settitle">Set</button></div>
      <p class="muted">Shown to candidates on the join screen and during the quiz.</p>
      <h2 style="margin-top:14px">Session</h2>
      <div class="row"><input id="sname" placeholder="e.g. Group 2 — 10:00" style="flex:1"><button class="primary" id="newsess">New session</button></div>
      <p class="muted">Fresh session: Q1 waiting to open, no candidates, no scores. The answer key, timer and scoring mode are kept — so this is also how you repeat the quiz for the next group.</p>
      <div class="row" style="margin-top:8px"><label class="muted">Timer (s, 0 = off)</label><input id="timer_in" type="number" min="0" max="600" value="${st.timer_seconds}" style="width:80px"><button id="settimer">Set</button></div>
      <div class="row" style="margin-top:8px"><label class="muted">Scoring</label><select id="scoring"><option value="speed" ${st.scoring==='speed'?'selected':''}>Speed: 100, 90, 80… (min 50)</option><option value="flat" ${st.scoring==='flat'?'selected':''}>Flat: 100 per correct</option></select></div>
      <div class="row" style="margin-top:8px"><label class="muted">Total questions</label><input id="total" type="number" min="1" max="100" value="${st.total_questions}" style="width:80px"><button id="settotal">Set</button></div>
      <div class="row" style="margin-top:8px"><label class="muted">Jump to Q</label><input id="goto" type="number" min="1" max="${st.total_questions}" value="${q}" style="width:80px"><button id="gotobtn">Go</button></div>
    </div>
    <div class="card">
      <h2>Answer key <button id="togglekey" style="padding:4px 10px;font-size:12px">${keyOpen?'hide':'edit'}</button></h2>
      <p class="muted">${Object.keys(key).length} of ${st.total_questions} set. Kept across sessions. Keep this hidden while candidates can see your screen. <a href="#" id="clearkey">Clear all</a> when you set up a different quiz.</p>
      <div class="key" style="${keyOpen?'':'display:none'}">
        ${Array.from({length:st.total_questions},(_,i)=>i+1).map(n=>`<div class="k"><span>${n}</span>${['A','B','C','D'].map(o=>`<button class="${key[n]===o?'on':''}" data-q="${n}" data-o="${o}">${o}</button>`).join('')}</div>`).join('')}
      </div>
    </div>
    <div class="card">
      <h2>Security</h2>
      <div class="row"><input id="newpin" placeholder="New PIN" style="flex:1"><button id="setpin">Change PIN</button></div>
      <p class="muted"><a href="#" id="logout">Log out</a></p>
    </div>
  </div>`;

  new QRCode(document.getElementById('qr'),{text:candidateUrl,width:160,height:160});
  Object.entries(keep).forEach(([id,v])=>{const el=document.getElementById(id); if(el){el.value=v; el.focus();}});
  tick();

  const on=(id,fn)=>{const el=document.getElementById(id); if(el) el.onclick=fn;};
  on('open',()=>act('open').then(load));
  on('lock',()=>act('lock').then(load));
  on('reveal',()=>act('reveal').then(load));
  on('next',()=>act('next').then(load));
  on('prev',()=>act('prev').then(load));
  on('endsess',()=>{ if(confirm('End this session? Candidates will see their final score and rank.')) act('end_session').then(load); });
  on('newsess',()=>{ if(confirm('Start a new session? Candidates and scores clear from the screen (answer key is kept).')) act('new_session',{name:document.getElementById('sname').value}).then(load); });
  on('settitle',()=>act('set_title',{title:document.getElementById('qtitle').value}).then(load));
  on('settimer',()=>act('set_timer',{seconds:+document.getElementById('timer_in').value}).then(load));
  document.getElementById('scoring').onchange=(e)=>act('set_scoring',{mode:e.target.value}).then(load);
  on('settotal',()=>act('set_total',{total:+document.getElementById('total').value}).then(load));
  on('gotobtn',()=>act('goto',{question:+document.getElementById('goto').value}).then(load));
  on('togglekey',()=>{keyOpen=!keyOpen;render(true);});
  on('setpin',async()=>{const p=document.getElementById('newpin').value.trim(); await act('set_pin',{pin:p}); pin=p; sessionStorage.setItem('quiz_pin',p); alert('PIN changed');});
  on('clearkey',(e)=>{e.preventDefault(); if(confirm('Clear the whole answer key?')) act('clear_key').then(async()=>{key=await act('get_key'); render(true);});});
  on('logout',(e)=>{e.preventDefault();sessionStorage.removeItem('quiz_pin');location.reload();});
  app.querySelectorAll('.key button').forEach(b=>b.onclick=async()=>{
    const n=b.dataset.q,o=b.dataset.o; const v=(key[n]===o)?'':o;
    await act('set_key',{[n]:v}); if(v) key[n]=v; else delete key[n]; render(true);
  });
  app.querySelectorAll('.g .x').forEach(x=>x.onclick=()=>{ if(confirm('Remove "'+x.dataset.g+'" from this session?')) act('remove_player',{name:x.dataset.g}).then(load); });
}

if(pin) start();
</script>
</body>
</html>
