<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz — Host</title>
<style>
  :root{--h:28px;--pad:10px;--bg:#0f1419;--card:#1a2129;--line:#2b3642;--text:#e8edf2;--muted:#8d9aa8;
        --accent:#4f8cff;--ok:#2ecc71;--bad:#e74c3c;--warn:#f1c40f;
        --A:#e74c3c;--B:#3498db;--C:#f1c40f;--D:#2ecc71;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  a{color:#9cc0ff}
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .gatecard{width:100%;max-width:400px;text-align:center;padding:24px}
  .topbar{display:flex;align-items:center;gap:var(--pad);padding:var(--pad);border-bottom:1px solid var(--line);background:#121920}
  .topbar .brand{font-weight:800;font-size:16px;letter-spacing:.02em}
  .topbar .crumb{color:var(--muted)}
  .topbar .sp{flex:1}
  .tabs{display:flex;gap:2px;background:#0f1419;border:1px solid var(--line);border-radius:8px;padding:2px;height:var(--h)}
  .tabs a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;padding:0 10px;border-radius:6px;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .tabs a:hover{color:var(--text)}
  .tabs a.on{background:#2b3642;color:var(--text)}
  .tabs .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px rgba(46,204,113,.25)}
  .topbar .out{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:0 10px;height:var(--h);display:inline-flex;align-items:center}
  .topbar .out:hover{color:var(--text)}
  .topbar .out .ico{display:none}
  @media(max-width:480px){.topbar .brand{display:none}.tabs{min-width:0;overflow-x:auto}.topbar .out .lbl{display:none}.topbar .out .ico{display:inline}}
  button.remove{background:#5a2a26;color:#ffb4ab}
  button.purple{background:#8e5cf6;color:#fff}
  .qz.new{background:linear-gradient(180deg,#2a1f4d,#1a2129);border:1px dashed #8e5cf6;color:#c9b6ff}
  .qz.new:hover{background:#2f2358;color:#fff}
  .links{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--pad)}
  .lk{background:#0f1419;border:1px solid var(--line);border-radius:12px;padding:var(--pad);display:flex;flex-direction:column;gap:8px}
  .lk b{font-size:15px}
  .pinrow{display:flex;align-items:center;gap:10px}
  .pinrow code{font-size:16px;letter-spacing:.2em;background:#0f1419;border:1px solid var(--line);border-radius:8px;padding:0 12px;height:var(--h);line-height:calc(var(--h) - 2px);min-width:120px;text-align:center}
  .iconbtn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:0;width:var(--h);height:var(--h);display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
  .iconbtn svg{width:16px;height:16px}
  .iconbtn:hover{color:var(--text);border-color:var(--accent)}
  .scr{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
  .scr:first-of-type{border-top:0;padding-top:0}
  .scr .t{flex:1;font-weight:600}
  [data-tip]{position:relative}
  [data-tip]:hover::after{content:attr(data-tip);position:absolute;right:0;top:calc(100% + 8px);width:max-content;background:#0f1419;border:1px solid var(--line);color:var(--text);font-size:12px;font-weight:400;line-height:1.4;padding:8px 10px;border-radius:8px;z-index:30;text-align:left;white-space:normal;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .lk{justify-content:space-between}
  .lk .row{margin-top:auto}
  .page{max-width:1100px;margin:0 auto;padding:var(--pad)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:var(--pad);margin-bottom:var(--pad)}
  h1{margin:0;font-size:22px}
  h2{margin:0 0 10px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .big{font-size:48px;font-weight:800;line-height:1}
  .timer{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1}
  .timer.low{color:var(--bad)} .timer.up{color:var(--warn);font-size:22px}
  .row{display:flex;gap:var(--pad);flex-wrap:wrap;align-items:center}
  button{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:8px;padding:0 12px;height:var(--h);cursor:pointer;background:#2b3642;color:var(--text);white-space:nowrap}
  button.primary{background:var(--accent);color:#fff}
  button.ok{background:var(--ok);color:#06220f}
  button.warn{background:var(--warn);color:#2a2400}
  button.danger{background:var(--bad);color:#fff}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  button.orange{background:#e67e22;color:#fff}
  button.magenta{background:#e0409a;color:#fff}
  h1{font-size:18px}
  .card{min-width:0}
  button.sm{padding:0 10px;font-size:13px}
  button:disabled{opacity:.35;cursor:default}
  input,select{font:inherit;font-size:16px;padding:0 8px;height:var(--h);border-radius:8px;border:1px solid var(--line);background:#0f1419;color:var(--text)}
  label.f{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;font-size:13px;color:var(--muted);min-width:0}
  label.f input,label.f select{width:100%}
  label.f input,label.f select{font-size:16px;color:var(--text)}
  .muted{color:var(--muted);font-size:13px}
  .pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;margin-right:4px}
  .pill.waiting{background:#2b3642;color:var(--muted)} .pill.open{background:#1d2f4d;color:#9cc0ff}
  .pill.locked{background:#3a3415;color:var(--warn)} .pill.revealed{background:#163d2b;color:var(--ok)}
  .pill.ended{background:#4a1f1b;color:#ff8a7f} .pill.timeup{background:#3a3415;color:var(--warn)}
  .pill.nokey{background:#4a1f1b;color:#ff8a7f} .pill.done{background:#163d2b;color:var(--ok)}
  /* home */
  .quizzes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--pad)}
  .qz{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:var(--pad);display:flex;flex-direction:column;gap:var(--pad)}
  .qz.new{align-items:center;justify-content:center;min-height:160px;cursor:pointer}
  .qz h3{margin:0;font-size:18px}
  .qz .meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
  .qz .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}
  .qz .actions button{padding:0}
  button.grey{background:#5b6775;color:#fff}
  .page.wide{max-width:1500px}
  @media(max-width:700px){ .slidebar .lbl{display:none} }
  .toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--muted);user-select:none}
  .toggle .sw{width:34px;height:20px;border-radius:999px;background:#2b3642;position:relative;transition:.15s}
  .toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#8d9aa8;transition:.15s}
  .toggle.on .sw{background:var(--accent)} .toggle.on .sw::after{left:17px;background:#fff}
  .toggle.rev{flex-direction:row}
  .modalbg{position:fixed;inset:0;background:rgba(5,8,12,.75);display:flex;align-items:center;justify-content:center;z-index:50;padding:var(--pad)}
  .modalbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:380px;width:100%;text-align:center}
  .modalbox p{margin:0 0 16px;font-size:16px}
  /* editor */
  .form{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--pad)}
  @media(max-width:700px){.form{grid-template-columns:1fr}}
  .form .wide{grid-column:1/-1}
  .key{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:8px}
  .key .k{display:flex;align-items:center;gap:5px;font-size:13px}
  .key .k span{width:26px;color:var(--muted);text-align:right}
  .key .k button{padding:0;width:32px;font-size:13px;background:#0f1419;border:1px solid var(--line);color:var(--muted)}
  .key .k button.on{color:#fff;border-color:transparent}
  .key .k button.on.A{background:var(--A)} .key .k button.on.B{background:var(--B)}
  .key .k button.on.C{background:var(--C);color:#2a2400} .key .k button.on.D{background:var(--D);color:#06220f}
  /* play */
  .qrmini{display:flex;gap:12px;align-items:center;cursor:pointer}
  .qrmini #qr{background:#fff;padding:4px;border-radius:6px;width:fit-content;line-height:0}
  .qrmini:hover .hint{color:var(--text)}
  .complete{text-align:center;padding:10px 0}
  .complete .h{font-size:28px;font-weight:800}
  .podium{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin:16px 0 6px}
  .podium div{background:#0f1419;border-radius:10px 10px 0 0;padding:10px;text-align:center;width:130px}
  .podium .p1{height:120px;border-top:4px solid var(--warn)} .podium .p2{height:95px;border-top:4px solid #bfc7d1} .podium .p3{height:80px;border-top:4px solid #c8792a}
  .podium b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .net{position:fixed;left:0;right:0;bottom:0;background:#4a1f1b;color:#ff8a7f;text-align:center;padding:8px;display:none}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#163d2b;color:var(--ok);padding:10px 16px;border-radius:10px;font-weight:600;display:none}
  .banner{border-radius:12px;padding:var(--pad);background:#1d2f4d;color:#9cc0ff;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .banner .sp{flex:1}
  /* live session — one spacing value (--gap) for padding, gaps between sections and between buttons */
  .live{--gap:var(--pad);display:flex;flex-direction:column;gap:var(--gap);padding:var(--gap);max-width:1500px;margin:0 auto}
  .live .card{padding:var(--gap);margin:0;min-width:0}
  .live.slides{display:grid;grid-template-columns:minmax(0,1fr) 300px;align-items:start;max-width:none}
  .a-main{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
  .a-side{min-width:0}
  @media(max-width:900px){.live.slides{grid-template-columns:1fr}}
  .sec{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
  .cpanel .sec + .sec{border-top:1px solid var(--line);padding-top:var(--gap);margin-top:var(--gap)}
  .sec h2{margin:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .sec h2 .muted{text-transform:none;letter-spacing:0;font-weight:500}
  .crow{display:flex;align-items:center;gap:var(--gap);flex-wrap:wrap}
  .crow.hdr{flex-wrap:nowrap} .hdr > :not(.ctitle){flex:none}
  .crow .sp{flex:1}
  .ctitle{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
  .live .timer,.cq{line-height:1;display:flex;align-items:center}
  .live .timer{font-size:20px}
  .live .timer:empty{display:none}
  .cq{font-size:16px;font-weight:800;white-space:nowrap;gap:3px} .cq small{font-size:12px;color:var(--muted);font-weight:600}
  .live .pill{margin:0}
  /* control row: [controls] [go to] ............ [new round][end session] */
  .cpanel{container-type:inline-size}
  .ctlr{display:flex;align-items:center;gap:var(--gap);flex:1 1 auto;flex-wrap:wrap}
  .grp{display:flex;gap:var(--gap)}
  .grp.sess{margin-left:auto}
  .cbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--h);padding:0 10px;font-size:13px;font-weight:700;border-radius:8px;white-space:nowrap}
  .cbtn svg{width:16px;height:16px}
  .cbtn svg{flex:none}
  .goto{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap}
  .goto input{width:56px;padding:0 6px;text-align:center}
  .goto button{width:40px;padding:0;display:inline-flex;align-items:center;justify-content:center}
  @container (max-width:620px){
    .grp.pctl{flex:1 1 100%} .grp.pctl .cbtn{flex:1 1 0;min-width:0;padding:0} .grp.pctl .lbl{display:none}
  }
  @container (max-width:540px){ .grp.sess .cbtn{width:40px;padding:0} .grp.sess .lbl{display:none} }
  /* pill boxes: label + its buttons / toggle grouped together */
  .pbox{display:inline-flex;align-items:center;gap:4px;height:var(--h);padding:0 2px 0 10px;border:1px solid var(--line);border-radius:10px;background:#141a21;font-size:13px;color:var(--muted);white-space:nowrap}
  .pbox.toggle{padding:0 10px;gap:8px}
  .pbox .toggle .sw,.pbox.toggle .sw{width:30px;height:16px} .pbox.toggle .sw::after{top:2px;width:12px;height:12px} .pbox.toggle.on .sw::after{left:16px}
  .pbox .iconbtn{width:calc(var(--h) - 4px);height:calc(var(--h) - 4px);border-color:transparent}
  .pbox .iconbtn:hover{border-color:var(--accent)}
  .screens{display:flex;align-items:center;gap:var(--gap);flex-wrap:wrap;margin-left:auto}
  .slidewrap{background:#000;border:1px solid var(--line);border-radius:14px;overflow:hidden;aspect-ratio:16/9;width:100%;max-height:calc(100vh - 120px)}
  .slidewrap iframe{width:100%;height:100%;border:0;display:block}
  .slidebar{display:flex;gap:var(--gap);align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .slidebar .sm{display:inline-flex;align-items:center;gap:6px}
  /* quiz panel: candidates table doubles as the leaderboard (sorted by total) */
  .qcard{container-type:inline-size;display:flex;flex-direction:column;gap:var(--gap)}
  .qcard .complete{border-bottom:1px solid var(--line);padding-bottom:var(--gap)}
  .complete .podium div{max-width:30%}
  .ctab{display:flex;flex-direction:column}
  .tr{display:grid;grid-template-columns:26px minmax(0,1fr) 56px 52px 48px 56px 28px;gap:8px;align-items:center;min-height:calc(var(--h) + 6px);padding:3px 0;font-size:14px}
  .tr + .tr{border-top:1px solid var(--line)}
  .tr.th{min-height:0;padding:0 0 4px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .tr .rk{color:var(--muted);text-align:right;font-size:12px}
  .rk .md{font-size:16px;line-height:1}
  .tr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .tr .c{text-align:center}
  .tr .n{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tr .tot{font-weight:800;color:var(--warn)}
  .ans{height:calc(var(--h) - 4px);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;background:#0f1419;border:1px solid var(--line);color:var(--muted)}
  .ans.done{background:#1d2f4d;border-color:#1d2f4d;color:#9cc0ff}
  .ans.right{background:var(--ok);border-color:var(--ok);color:#06220f}
  .ans.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
  .rmx{width:var(--h);height:var(--h);padding:0;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--line);color:var(--muted);font-size:12px;border-radius:8px}
  .rmx:hover{color:#ff8a7f;border-color:var(--bad)}
  @container (max-width:380px){ .tr{grid-template-columns:16px minmax(0,1fr) 46px 38px 32px 38px 22px;gap:6px;font-size:12px} .rmx{width:22px;height:22px} }
  @media(max-width:700px){ .screens{margin-left:0} }
</style>
</head>
<body>
<div id="gate" class="gate"><div class="card gatecard">
  <div class="brand" style="font-size:22px;font-weight:800">QuizApp</div>
  <h1 style="font-size:20px;margin:14px 0 4px">Host login</h1>
  <p class="muted" style="margin:0 0 14px">Enter the host PIN.</p>
  <input id="pin" type="password" placeholder="PIN" style="width:100%;text-align:center;letter-spacing:.2em">
  <button class="primary" id="login" style="width:100%;margin-top:10px">Enter</button>
  <p id="pinerr" style="color:#ff8a7f;min-height:18px"></p>
  <a href="./" class="muted" style="font-size:13px;text-decoration:none">← Back to QuizApp home</a>
</div></div>
<div id="app" style="display:none"></div>
<div class="net" id="net">Connection lost — retrying…</div>
<div class="toast" id="toast"></div>

<script src="vendor-supabase.js"></script>
<script src="vendor-qrcode.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(QUIZ_CONFIG.url, QUIZ_CONFIG.key);
const app = document.getElementById('app'), net = document.getElementById('net');
let pin = sessionStorage.getItem('quiz_pin') || '';
let st=null, players=[], avatars={}, answers=[], correct=null, clockOffset=0;
let quizzes=[], editing=null, confirmReset=false, helpOpen=false, linkShown='', slidesOn = localStorage.getItem('quiz_slides')!=='0';              // editing = working copy of a quiz in the editor
let view = 'home';                          // home | edit | play | settings
const baseUrl = location.origin + location.pathname.replace(/host(\.html)?$/,'');
const candidateUrl = baseUrl + 'play/';
const joinUrl = baseUrl + 'join.html';

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const serverNow = () => Date.now() - clockOffset;
async function syncClock(){ try{ const t0=Date.now(); const {data}=await sb.rpc('server_now'); const t1=Date.now(); if(data) clockOffset=(t0+t1)/2-new Date(data).getTime(); }catch(e){} }
async function act(action, value={}){
  const {data,error} = await sb.rpc('host_action',{p_pin:pin,p_action:action,p_value:value});
  if(error){ toast(error.message, true); throw error; }
  return data;
}
let toastT; function toast(msg, bad){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; t.style.background=bad?'#4a1f1b':'#163d2b'; t.style.color=bad?'#ff8a7f':'var(--ok)'; clearTimeout(toastT); toastT=setTimeout(()=>t.style.display='none',2500); }

// ---------- auth ----------
async function login(){
  const p = document.getElementById('pin').value.trim();
  const {error} = await sb.rpc('host_action',{p_pin:p,p_action:'ping'});
  if(error){ document.getElementById('pinerr').textContent = error.message; return; }
  pin = p; sessionStorage.setItem('quiz_pin', p); start();
}
document.getElementById('login').onclick = login;
document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==='Enter') login();});

async function start(){
  document.getElementById('gate').style.display='none';
  app.style.display='block';
  await syncClock();
  await loadQuizzes();
  sb.channel('host')
    .on('postgres_changes',{event:'*',schema:'public',table:'quiz_state'},load)
    .on('postgres_changes',{event:'*',schema:'public',table:'answers'},load)
    .on('postgres_changes',{event:'*',schema:'public',table:'players'},load)
    .subscribe();
  setInterval(load, 3000); setInterval(tick, 250); setInterval(syncClock, 60000);
  window.addEventListener('hashchange', route);
  await load(); route();
}
function route(){
  const h = location.hash.replace('#','');
  if(h==='play'){ if(liveActive()||(st&&st.session_id)) view='play'; else { view='home'; toast('No live session — press Play on a quiz'); } }
  else if(h==='settings') view='settings';
  else if(h.startsWith('edit-')){ const id=h.slice(5); const q = id==='new' ? null : activeQuizzes().find(x=>String(x.id)===id); editing = id==='new' ? {id:null,title:'',total_questions:10,timer_seconds:30,scoring:'speed',answer_key:{},embed_url:''} : (q?JSON.parse(JSON.stringify(q)):null); view = editing?'edit':'home'; }
  else view='home';
  lastSig=''; render(true);
}
const go = (h) => { location.hash = h; };

// ---------- data ----------
let binOpen=false;
async function loadQuizzes(){ const {data,error}=await sb.rpc('quiz_library',{p_pin:pin}); if(error){toast(error.message,true);throw error;} quizzes = data||[]; }
const activeQuizzes = () => quizzes.filter(q=>!q.archived);
const binnedQuizzes = () => quizzes.filter(q=>q.archived);
async function load(){
  try{
    const {data:s,error} = await sb.from('quiz_state').select('*').eq('id',1).single();
    if(error) throw error;
    st = s;
    if(view==='play' || view==='home'){
      const [g,a] = await Promise.all([
        sb.from('players').select('name,avatar').eq('session_id',s.session_id).order('joined_at'),
        sb.from('answers').select('player,question,choice,is_correct,points,elapsed_ms').eq('session_id',s.session_id)
      ]);
      players = (g.data||[]).map(r=>r.name); avatars = {}; (g.data||[]).forEach(r=>avatars[r.name]=r.avatar||''); answers = a.data||[];
      correct = s.revealed ? (await sb.rpc('revealed_answer',{p_question:s.current_question})).data : null;
    }
    net.style.display='none';
  }catch(e){ net.style.display='block'; }
  render();
}
function remaining(){
  if(!st || !st.timer_seconds || !st.question_opened_at) return null;
  return Math.max(0, st.timer_seconds - (serverNow() - new Date(st.question_opened_at).getTime())/1000);
}
let wasExpired=false;
function tick(){
  const el=document.getElementById('timer'); if(!el||!st) return;
  const r=remaining();
  if(r===null || st.revealed || st.locked || st.ended){ el.textContent=''; return; }
  el.textContent = r>0 ? Math.ceil(r) : "";
  el.className = 'timer' + (r<=0?' up':r<=10?' low':'');
  if((r<=0)!==wasExpired){ wasExpired=(r<=0); render(true); }
}
function scoresFor(){
  const shown = a => a.question!==st.current_question || st.revealed;   // don't count the live question before reveal
  return players.map(g=>{ const m=answers.filter(a=>a.player===g && shown(a)); const ok=m.filter(a=>a.is_correct===true);
      return {g, p:m.reduce((t,a)=>t+(a.points||0),0), c:ok.length, t:ok.reduce((t,a)=>t+(a.elapsed_ms||0),0)}; })
    .sort((x,y)=>y.p-x.p||x.t-y.t||x.g.localeCompare(y.g));   // ties: lower total time on correct answers wins
}
const keyCount = (q) => Object.values(q.answer_key||{}).filter(v=>['A','B','C','D'].includes(v)).length;
const liveActive = () => st && !st.ended && st.session_id;
// Scoring rule lives in quiz_state (host-editable in Settings); describe it in words
const rule = () => ({top:(st&&st.speed_top)||100, step:(st&&st.speed_step)??5, min:(st&&st.speed_min)??10, flat:(st&&st.flat_points)||100});
function speedText(){ const r=rule(); return r.step?`${r.top}, ${r.top-r.step}, ${r.top-2*r.step}… (min ${r.min})`:`${r.top} each`; }
function candTable(withRemove){
  const q=st.current_question, cur={}; answers.filter(a=>a.question===q).forEach(a=>cur[a.player]=a);
  const rows = scoresFor().map((x,i)=>{ const a=cur[x.g];
    let ans='…', cls='';
    if(a){ if(st.revealed){ ans=a.choice; cls=a.is_correct?'right':'wrong'; } else { ans=st.locked?a.choice:'✓'; cls='done'; } }
    return `<div class="tr"><span class="rk">${x.p>0&&i<3?'<span class="md">'+['🥇','🥈','🥉'][i]+'</span>':i+1}</span><span class="nm">${avatars[x.g]||''} ${esc(x.g)}</span><span class="ans ${cls}">${ans}</span>`+
      `<span class="n">${a?(a.elapsed_ms/1000).toFixed(1)+' s':''}</span><span class="n">${a&&st.revealed?(a.points?'+'+a.points:'0'):''}</span><span class="n tot">${x.p}</span>`+
      (withRemove?`<button class="rmx" data-rm="${esc(x.g)}" title="Remove from session" aria-label="Remove ${esc(x.g)}">✕</button>`:'')+`</div>`; }).join('');
  return `<div class="ctab${withRemove?'':' norm'}"><div class="tr th"><span class="rk">#</span><span class="nm">Candidate</span><span class="c">Answer</span><span class="n">Time</span><span class="n">Q pts</span><span class="n">Total</span>${withRemove?'<span></span>':''}</div>${rows}</div>`;
}

// ---------- render ----------
let lastSig='';
function render(force){
  const sig = JSON.stringify([view,st,players,answers,correct,quizzes,editing,binOpen,pinShown,confirmReset,slidesOn,helpOpen,linkShown]);
  if(!force && sig===lastSig) return;
  lastSig = sig;
  const keep = {}; app.querySelectorAll('input,select').forEach(el=>{ if(document.activeElement===el) keep[el.id]=el.value; });
  const oldFrame=document.getElementById('slides');
  app.innerHTML = topbar() + (view==='home'?home():view==='edit'?editor():view==='settings'?settings():play()) + linkModal();
  const newFrame=document.getElementById('slides'); if(oldFrame&&newFrame&&oldFrame.src===newFrame.src) newFrame.replaceWith(oldFrame);
  Object.entries(keep).forEach(([id,v])=>{const el=document.getElementById(id); if(el){el.value=v; el.focus();}});
  bind();
}
function linkModal(){
  return linkShown ? `<div class="modalbg" id="linkmodal" style="z-index:60"><div class="modalbox"><p style="margin-bottom:8px">Link</p><input readonly value="${esc(linkShown)}" style="width:100%;text-align:center" onfocus="this.select()"><div class="row" style="justify-content:center;margin-top:12px"><button class="primary sm" data-copy="${esc(linkShown)}">Copy link</button><button class="grey sm" id="linkclose">Close</button></div></div></div>` : '';
}

  return `<div class="topbar"><span class="brand">QuizApp</span>
    <nav class="tabs">

function normalizeEmbed(v){
  v=(v||'').trim(); if(!v) return '';
  const m=v.match(/src\s*=\s*["']([^"']+)["']/i); if(m) v=m[1];              // pasted <iframe …> code
  try{ const u=new URL(v);
    if(/canva\.com$/.test(u.hostname)||u.hostname.endsWith('.canva.com')){ u.pathname=u.pathname.replace(/\/(edit|watch)$/,'/view'); if(!u.pathname.endsWith('/view')) u.pathname=u.pathname.replace(/\/?$/,'/view'); u.search='?embed'; return u.toString(); }
    if(u.hostname==='docs.google.com' && u.pathname.includes('/presentation/')){ const id=(u.pathname.match(/\/presentation\/d\/(e\/)?([^/]+)/)||[])[0]; if(id) return u.origin+id+'/embed?start=false&loop=false'; }
    return u.toString();
  }catch(e){ return v; }
}

function play(){
  if(!st) return '<div class="page muted">Loading…</div>';
  const q = st.current_question;
  const cur = {}; answers.filter(a=>a.question===q).forEach(a=>cur[a.player]=a);
  const done = players.filter(g=>cur[g]).length;
  const r = remaining(), timeUp = r!==null && r<=0;
  const status = st.ended?'ended':st.revealed?'revealed':st.locked?(st.question_opened_at?'locked':'waiting'):timeUp?'timeup':'open';
  const statusLabel = {ended:'SESSION ENDED',revealed:'REVEALED',locked:'LOCKED',waiting:'WAITING TO OPEN',timeup:"TIME UP",open:'OPEN'}[status];
  const quiz = quizzes.find(x=>x.id===st.quiz_id); const keyCur = quiz && quiz.answer_key[q];
  const revealedN = (q-1)+(st.revealed?1:0);
  const scores = scoresFor();
  const canOpen = !st.ended && (!st.question_opened_at || st.locked || timeUp) && !st.revealed;
  const lastRevealed = st.revealed && q>=st.total_questions;
  const complete = lastRevealed || st.ended;

  const completeCard = complete ? `<div class="complete">
      <div class="h">🎉 Quiz complete</div>
      <div class="muted">${esc(st.quiz_title)} · ${esc(st.session_name)} · ${players.length} players</div>
      <div class="podium">${[1,0,2].map(i=>scores[i]?`<div class="p${i+1}"><b>${avatars[scores[i].g]||''} ${esc(scores[i].g)}</b><span class="muted">${scores[i].p} pts</span><span class="muted" style="display:block;font-size:11px">${(scores[i].t/1000).toFixed(1)} s total</span></div>`:'').join('')}</div>
      ${st.ended?'<p class="muted">Candidates are seeing their final score and rank.</p>':'<p class="muted">Press <b>Finish</b> to show candidates their final score and rank.</p>'}
    </div>` : '';

  const embed = quiz && quiz.embed_url;
  const showSlides = embed && slidesOn;
  const toggle = embed ? `<label class="toggle pbox ${slidesOn?'on':''}" id="slidestoggle" title="Show or hide the slides pane"><span>Show slides</span><span class="sw"></span></label>` : '';
  const remoteToggle = ('documentPictureInPicture' in window) ? `<label class="toggle pbox ${pipWin&&!pipWin.closed?'on':''}" id="piptoggle" title="Floating always-on-top remote control"><span>Show remote</span><span class="sw"></span></label>` : '';
  const cb=(id,cls,icon,label,title,dis)=>`<button class="cbtn ${cls}" id="${id}" title="${title}" ${dis?'disabled':''}>${id==='next'?`<span class="lbl">${label}</span>${icon}`:`${icon}<span class="lbl">${label}</span>`}</button>`;
  const restart = st.question_opened_at && !st.revealed;
  const scrLink=(t,u,win)=>`<span class="pbox">${t}
      <button class="iconbtn" data-open="${u}" data-win="${win}" data-tip="Open in new window" aria-label="Open ${t} in new window">${ICON_EXT}</button>
      <button class="iconbtn" data-copy="${u}" data-tip="Copy link" aria-label="Copy ${t} link">${ICON_COPY}</button>
      <button class="iconbtn" data-showlink="${u}" data-tip="Show link" aria-label="Show ${t} link">${ICON_LINK}</button></span>`;
  const controlPanel = `<div class="card cpanel">
      <div class="sec">
        <div class="crow hdr">
          <div class="ctitle"><b>${esc(st.quiz_title)}</b><span class="muted"> · ${esc(st.session_name)}</span></div>
          <span class="pill ${status}">${statusLabel}</span>${keyCur?'':'<span class="pill nokey">No key for Q'+q+'</span>'}
          <span class="sp"></span>
          <div class="timer" id="timer"></div>
          <div class="cq">Q${q}<small> / ${st.total_questions}</small></div>
        </div>
        <div class="crow">
          <div class="grp pctl">
            ${cb('prev','',PI.prev,'Previous','Previous question',q<=1||st.ended)}
            ${cb('open','ok',restart?PI.restart:PI.open,restart?'Restart':'Open',restart?'Restart timer':'Open question',!canOpen)}
            ${cb('lock','warn',PI.lock,'Lock','Lock answers',status!=='open')}
            ${cb('reveal','orange',PI.eye,'Reveal','Reveal answer',st.revealed||!keyCur||!st.question_opened_at||st.ended)}
            ${lastRevealed&&!st.ended?cb('endsess','magenta',PI.flag,'Finish','Finish & show results',false):cb('next','',PI.next,'Next','Next question',q>=st.total_questions||st.ended)}
          </div>
          <div class="ctlr">
          <div class="goto"><label for="goto">Go to Question</label><input id="goto" type="number" min="1" max="${st.total_questions}" value="${q}" inputmode="numeric"><button class="primary" id="gotobtn" title="Go to question" aria-label="Go to question">${PI.next}</button></div>
          <div class="grp sess">
            ${cb('newround','purple',PI.round,'New round','New round: same quiz, fresh players and scores',false)}
            ${cb('endsess2','danger',PI.stop,'End session','End session',st.ended)}
          </div>
          </div>
        </div>
      </div>
      <div class="sec"><div class="crow">${toggle}${remoteToggle}
        <div class="screens">${scrLink('Join screen',joinUrl,'quizjoin')}${scrLink('Leaderboard',baseUrl+'board.html','quizboard')}</div>
      </div></div>
    </div>`;
  const slidePane = showSlides ? `<div class="slidewrap"><iframe id="slides" src="${esc(embed)}" allow="fullscreen" allowfullscreen loading="lazy" title="Presentation"></iframe></div>
      <div class="slidebar">
        <button class="iconbtn" id="slideshelp" title="How the slides pane works">${ICON_HELP}</button>
        <button class="sm" id="slidesfs">${ICON_FS}<span class="lbl">Full screen</span></button><button class="sm" id="slidesnew">${ICON_EXT}<span class="lbl">New window</span></button></div>
      ${helpOpen?`<div class="modalbg" id="helpmodal"><div class="modalbox" style="text-align:left"><p><b>Slides pane</b></p><p class="muted" style="margin:0 0 10px">Click inside the slides, then use ← → (or Canva's own arrows) to move between slides. The quiz buttons control the quiz only — they do not change slides.</p><p class="muted" style="margin:0 0 14px">Full screen shows the pane on this screen; New window opens the deck in its own window, which you can drag to the projector.</p><div class="row" style="justify-content:flex-end"><button class="grey sm" id="helpclose">Close</button></div></div></div>`:''}` : '';
  const candidatesSec = `<div class="sec"><h2>Candidates <span class="muted">${done}/${players.length} answered Q${q} · ${revealedN} of ${st.total_questions} revealed</span></h2>
      ${players.length?candTable(true):'<p class="muted" style="margin:0">Nobody has joined yet. Open the join screen on a second display.</p>'}</div>`;
  const quizPanel = `<div class="card qcard">${completeCard}${candidatesSec}</div>`;
  if(showSlides){
    return `<div class="live slides">
      <div class="a-main">${controlPanel}${slidePane}</div>
      <div class="a-side">${quizPanel}</div>
    </div>`;
  }
  return `<div class="live">${controlPanel}${quizPanel}</div>`;
}

// ---------- events ----------
function bind(){
  const on=(id,fn)=>{const el=document.getElementById(id); if(el) el.onclick=fn;};
  app.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));
  on('logout',(e)=>{e.preventDefault();sessionStorage.removeItem('quiz_pin');location.hash='';location.reload();});
  // home

  app.querySelectorAll('[data-kq]').forEach(b=>b.onclick=()=>{ readForm(); const i=b.dataset.kq,o=b.dataset.ko; if(editing.answer_key[i]===o) delete editing.answer_key[i]; else editing.answer_key[i]=o; render(true); });
  on('resetkey',()=>{ readForm(); confirmReset=true; render(true); });

  on('save',async()=>{ const q=await save(); if(q) render(true); });

  on('endsess',end); on('endsess2',end);

  tick();
}

async function openPresenter(){
  if(pipWin && !pipWin.closed){ pipWin.focus(); return; }
  if(!('documentPictureInPicture' in window)){ toast('The remote needs Microsoft Edge or Chrome (version 116 or newer).', true); return; }
  try{
    let sz={width:420,height:600}; try{ sz=JSON.parse(localStorage.getItem('quiz_pip_size'))||sz; }catch(e){}
    pipWin = await documentPictureInPicture.requestWindow({width:sz.width,height:sz.height});
    pipWin.addEventListener('resize',()=>{ fitPip(); try{ localStorage.setItem('quiz_pip_size',JSON.stringify({width:pipWin.innerWidth,height:pipWin.innerHeight})); }catch(e){} });
  }catch(e){ toast('Could not open the remote: '+e.message, true); return; }
  const st=pipWin.document.createElement('style'); st.textContent=PIP_CSS; pipWin.document.head.appendChild(st);
  pipWin.document.title='QuizApp remote';
  pipWin.addEventListener('pagehide',()=>{ pipWin=null; pipSig=''; try{render(true);}catch(e){} });
  pipSig=''; renderPip(); render(true);
}
function presenterBar(){
  const q=st.current_question, cur={}; answers.filter(a=>a.question===q).forEach(a=>cur[a.player]=a);
  const r=remaining(), timeUp=r!==null&&r<=0;
  const status = st.ended?'ended':st.revealed?'revealed':st.locked?(st.question_opened_at?'locked':'waiting'):timeUp?'timeup':'open';
  const label = {ended:'ENDED',revealed:'REVEALED',locked:'LOCKED',waiting:'WAITING',timeup:'TIME UP',open:'OPEN'}[status];
  const quiz=quizzes.find(x=>x.id===st.quiz_id); const keyCur=quiz&&quiz.answer_key[q];
  const canOpen = !st.ended && (!st.question_opened_at || st.locked || timeUp) && !st.revealed;
  const lastRevealed = st.revealed && q>=st.total_questions;
  const done = players.filter(g=>cur[g]).length;
  const bar = `<div class="pbar"><div class="prow top">
    <div class="pq">Q${q}<small>/${st.total_questions}</small></div>
    <span class="status ${status}">${label}</span>
    <div class="ptimer" id="ptimer"></div>
    </div><div class="prow ctl">
    <div class="pgrp pctl">
      <button id="prev" class="wl" title="Previous question" ${q<=1||st.ended?'disabled':''}>${PI.prev}<span>Prev</span></button>
      <button class="ok" id="open" title="${st.question_opened_at&&!st.revealed?'Restart timer':'Open question'}" ${canOpen?'':'disabled'}>${st.question_opened_at&&!st.revealed?PI.restart:PI.open}</button>
      <button class="warn" id="lock" title="Lock answers" ${status==='open'?'':'disabled'}>${PI.lock}</button>
      <button class="orange" id="reveal" title="Reveal answer" ${st.revealed||!keyCur||!st.question_opened_at||st.ended?'disabled':''}>${PI.eye}</button>
      ${lastRevealed&&!st.ended?`<button class="magenta" id="endsess" title="Finish &amp; show results">${PI.flag}</button>`:`<button id="next" class="wl" title="Next question" ${q>=st.total_questions||st.ended?'disabled':''}><span>Next</span>${PI.next}</button>`}
    </div>
  </div>
  <div class="prow mid"><div style="width:100%">${players.length?candTable(true):'<span class="muted">No candidates yet</span>'}<div class="cnt">${done}/${players.length} answered</div></div></div>
  <div class="prow bot"><div class="pgrp sess">
      <button class="purple" id="newround" title="New round (same quiz, fresh players and scores)">${PI.round}<span>New round</span></button>
      <button class="danger" id="endsess2" title="End session" ${st.ended?'disabled':''}>${PI.stop}<span>End session</span></button>
  </div></div>
  </div>`;
  return bar;
}
function renderPip(){
  if(!pipWin||pipWin.closed||!st) return;
  const sig=JSON.stringify([st,players,answers,avatars,quizzes.map(x=>[x.id,x.answer_key])]);
  if(sig===pipSig) return; pipSig=sig;
  const d=pipWin.document; d.body.innerHTML=presenterBar();
  const on=(id,fn)=>{const el=d.getElementById(id); if(el) el.onclick=fn;};
  const go=(a,v)=>()=>act(a,v).then(load).catch(()=>{});
  on('prev',go('prev')); on('open',go('open')); on('lock',go('lock')); on('reveal',go('reveal')); on('next',go('next'));
  on('endsess',()=>{ if(pipWin.confirm('End this session? Candidates will see their final score and rank.')) act('end_session').then(load); });
  on('endsess2',()=>{ if(pipWin.confirm('End this session?')) act('end_session').then(load); });
  on('newround',()=>{ if(pipWin.confirm('Start a new round? Players and scores clear (same quiz).')) act('new_round').then(load); });
  d.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{ if(pipWin.confirm('Remove "'+x.dataset.rm+'" from this session?')) act('remove_player',{name:x.dataset.rm}).then(load); });
  on('gotobtn',()=>act('goto',{question:+d.getElementById('goto').value}).then(load));
  tickPip(); fitPip();
}
// Remote: keep names whole — size the name column to the longest name, then hide Answer, Time, Q pts (in that order) if the window is too narrow
function fitPip(){
  if(!pipWin||pipWin.closed) return; const t=pipWin.document.querySelector('.ctab'); if(!t) return;
  const mid=t.closest('.prow'); t.classList.remove('h1','h2','h3'); t.style.removeProperty('--nmw');
  let w=0; t.querySelectorAll('.nm').forEach(n=>w=Math.max(w,n.scrollWidth));
  t.style.setProperty('--nmw',Math.ceil(w)+'px');
  for(const c of ['h1','h2','h3']){ if(t.scrollWidth<=t.clientWidth) break; t.classList.add(c); }
  if(mid) mid.classList.toggle('hscroll', t.scrollWidth>t.clientWidth);   // sideways scroll only when even the short table can't fit
}
function tickPip(){
  if(!pipWin||pipWin.closed||!st) return; const el=pipWin.document.getElementById('ptimer'); if(!el) return;
  const r=remaining();
  if(r===null||st.revealed||st.locked||st.ended){ el.textContent=''; return; }
  el.textContent = r>0?Math.ceil(r):'TIME UP'; el.className='ptimer'+(r<=0?' up':r<=10?' low':'');
}
setInterval(tickPip,250);
const _render=render; render=function(force){ _render(force); renderPip(); };

if(pin) start();
</script>
